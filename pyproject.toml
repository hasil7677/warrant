[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warrant"
version = "0.1.0"
description = "Capability-class authorization gate for agent actions: registry, policy, broker, ledger, journal, workflow runner."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PyYAML>=6.0",
    "requests>=2.32",
    "anthropic>=0.69",
]

[project.optional-dependencies]
google = [
    "google-auth>=2.35",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.140",
]
console = [
    "fastapi>=0.141",
    "uvicorn>=0.30",
]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["warrant*"]
